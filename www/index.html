    <p class="muted" style="margin:8px 0 0;font-size:.82rem">${IS_NATIVE?'문서·다운로드 폴더에 저장하면 휴대폰의 \'내 파일\' 앱에서 찾을 수 있어요. 앱을 지워도 남아요.':'PC에서는 \'직접 고르기\'로 원하는 폴더에 저장할 수 있어요.'}</p>

function opt_(list,v){ return list.map(([k,l])=>`<option value="${esc(k)}" ${k===v?'selected':''}>${esc(l)}</option>`).join(''); }
async function bkWriter(dest,name){
  if(IS_NATIVE&&CAP&&CAP.Filesystem){
    const FS=CAP.Filesystem, sub=dest==='docs'?'가챠게임메이커/':dest==='download'?'Download/가챠게임메이커/':'', dir=dest==='docs'?'DOCUMENTS':dest==='download'?'EXTERNAL_STORAGE':'CACHE', path=sub+name;
    if(dest!=='share'){ try{ if(FS.requestPermissions) await FS.requestPermissions(); }catch(e){} }
    let first=true, buf='';
    const put=async()=>{ if(!buf&&!first) return; const data=buf; buf=''; if(first){ await FS.writeFile({path,data,directory:dir,encoding:'utf8',recursive:true}); first=false; } else await FS.appendFile({path,data,directory:dir,encoding:'utf8'}); };
    return {write:async s=>{ buf+=s; if(buf.length>1500000) await put(); }, close:async()=>{ await put(); const u=await FS.getUri({path,directory:dir}); return {uri:u.uri,where:dest==='share'?'':(dest==='docs'?'Documents/':'')+path}; }};
  }
  if(dest==='pick'&&window.showSaveFilePicker){ const h=await window.showSaveFilePicker({suggestedName:name,types:[{description:'백업 파일',accept:{'application/json':['.json']}}]}); const ws=await h.createWritable(); return {write:s=>ws.write(s),close:async()=>{ await ws.close(); return {where:h.name}; }}; }
  const parts=[]; return {write:async s=>{ parts.push(s); },close:async()=>({blob:new Blob(parts,{type:'application/json'})})};
}
async function exportGo(o){
  const share=!!o.share, dest=o.dest; try{ localStorage.setItem('ggm-bkdest',dest); }catch(e){}
  const stamp=new Date(), ds=stamp.toISOString().slice(0,10)+'_'+String(stamp.getHours()).padStart(2,'0')+String(stamp.getMinutes()).padStart(2,'0');
  const safe=String(G.meta.title||'game').replace(/[^\w가-힣-]+/g,'_').slice(0,20);
  const name=(share?'gacha-share-'+safe+'-':'gacha-backup-'+safe+'-')+ds+'.json', title=share?G.meta.title+' 공유 팩':APP_NAME+' 백업';
  let w; try{ w=await bkWriter(dest,name); }catch(e){ if(e&&e.name==='AbortError') return; if(IS_NATIVE&&dest!=='share'){ toast('그 폴더에 쓸 수 없어서 공유하기로 바꿔 저장해요'); return exportGo(Object.assign({},o,{dest:'share'})); } toast('저장할 곳을 열지 못했어요'); return; }
  try{
    syBar&&syBar(share?'공유 팩 만드는 중…':'백업 만드는 중…'); await flush();
    let game=G; const imgOK={};
    if(share){ game=JSON.parse(JSON.stringify(G)); delete game.prog; game.chars.forEach(c=>{ delete c.voiceId; delete c.voiceName; }); }
    const objs=(!share||o.img)?allImgObjs().filter(x=>x.img&&x.img.idb):[];
    if(share){ const want=new Set(objs.map(x=>x.id)); imgObjsOf(game).forEach(x=>{ if(!want.has(x.id)) x.img=null; }); if(!o.audio) game.lib.forEach(l=>{ if(l.audio) l.audio=null; }); }
    await w.write(`{"app":"gacha-game-maker","kind":"${share?'share':'backup'}","ver":${JSON.stringify(VER)},"build":${JSON.stringify(APP_BUILD)},"at":${JSON.stringify(stamp.toISOString())},"game":`+JSON.stringify(game)+',"images":{');
    let n=0, first=true; for(const x of objs){ n++; if(n%10===0) syBar(`그림 넣는 중 ${n}/${objs.length}`); try{ const b=await idbGetNS(x.id); if(b){ await w.write((first?'':',')+JSON.stringify(x.id)+':'+JSON.stringify(await blobToData(b))); first=false; } }catch(e){} }
    await w.write('},"audios":{'); first=true;
    if(!share||o.audio) for(const l of G.lib){ if(l.audio&&l.audio.idb){ try{ const b=await idbGetNS('a_'+l.id); if(b){ await w.write((first?'':',')+JSON.stringify(l.id)+':'+JSON.stringify(await blobToData(b))); first=false; } }catch(e){} } }
    await w.write('},"voices":{'); first=true;
    if(!share&&o.voice){ try{ for(const k of await idbKeys()){ if(String(k).startsWith('v_')){ const b=await idbGet(k); if(b){ await w.write((first?'':',')+JSON.stringify(k)+':'+JSON.stringify(await blobToData(b))); first=false; } } } }catch(e){} }
    await w.write('}}');
    syBar('저장하는 중…'); const r=await w.close(); syBar('');
    if(r.uri&&dest==='share'){ if(CAP&&CAP.Share) await CAP.Share.share({title,files:[r.uri]}); return; }
    if(r.blob){ const file=new File([r.blob],name,{type:'application/json'});
      if(dest==='share'&&navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title}); return; }
      const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
      toast('다운로드 폴더에 저장했어요 · '+name); return; }
    openModal(`${head(share?'공유 팩을 저장했어요':'백업을 저장했어요')}<p style="word-break:break-all"><b>${esc(r.where||name)}</b></p><p class="muted">${IS_NATIVE?'휴대폰의 \'내 파일\'(파일 관리자) 앱에서 이 위치를 찾으면 돼요. 불러올 때는 설정 → 데이터 → 백업 파일 불러오기.':'불러올 때는 설정 → 데이터 → 백업 파일 불러오기.'}</p><div class="row" style="margin-top:12px">${IS_NATIVE&&r.uri&&CAP.Share?`<button class="btn ghost" data-act="bkshare" data-uri="${esc(r.uri)}">다른 곳으로도 보내기</button>`:''}<button class="btn" data-act="close">확인</button></div>`);
  }catch(e){ syBar(''); if(e&&e.name==='AbortError') return; if(IS_NATIVE&&dest!=='share'){ toast('그 폴더에 저장하지 못해서 공유하기로 다시 저장해요'); return exportGo(Object.assign({},o,{dest:'share'})); } toast('파일을 저장하지 못했어요. '+((e&&e.message)||'')); }
}
$('#bkfile').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  let d,game; try{ d=JSON.parse(await f.text()); game=d.game||d; if(!game||!Array.isArray(game.chars)) throw 0; }catch(err){ toast('올바른 백업 파일이 아니에요'); return; }
  const isShare=d.kind==='share';
  let toNew=false;
  if(isShare){ toNew=confirm(`공유 팩 「${(game.meta&&game.meta.title)||'게임'}」이에요. 새 게임으로 추가할까요?\n(취소를 누르면 지금 게임을 덮어쓸지 물어봐요)`); if(!toNew&&!confirm('지금 게임을 이 팩으로 덮어쓸까요? 진행 상황도 처음부터예요.')) return; }
  toast('불러오는 중이에요');
  try{
    const imgs=d.images||{}, auds=d.audios||{}, vs=d.voices||{}, dec={}, adec={}, vdec={};
    for(const [k,v] of Object.entries(imgs)) dec[k]=await (await fetch(v)).blob();
    for(const [k,v] of Object.entries(auds)) adec[k]=await (await fetch(v)).blob();
    for(const [k,v] of Object.entries(vs)) if(String(k).startsWith('v_')) vdec[k]=await (await fetch(v)).blob();
    const objs=imgObjsOf(game);
    if(toNew){
      const id2='g'+uid(), ns=id2+'::';
      for(const o of objs){ if(dec[o.id]){ await idbPut(ns+o.id,dec[o.id]); o.img={idb:true}; } else if(o.img) o.img=null; }
      for(const l of game.lib||[]){ if(adec[l.id]){ await idbPut(ns+'a_'+l.id,adec[l.id]); l.audio={idb:true}; } else if(l.audio) l.audio=null; }
      await flush(); localStorage.setItem(pjKey(id2),JSON.stringify(game));
      const pj=PJ(); pj.list.push({id:id2,title:(game.meta&&game.meta.title)||'공유 게임'}); pj.active=id2; localStorage.setItem(PJKEY,JSON.stringify(pj));
      toast('새 게임으로 추가했어요. 다시 시작할게요'); setTimeout(()=>location.reload(),900); return;
    }
    for(const o of objs){
      if(dec[o.id]){ await idbPut(IMGNS+o.id,dec[o.id]); if(imgCache[o.id]) URL.revokeObjectURL(imgCache[o.id]); imgCache[o.id]=URL.createObjectURL(dec[o.id]); o.img={idb:true}; }
      else if(o.img&&o.img.asset) o.img=null;
    }
    for(const l of game.lib||[]){ if(adec[l.id]){ await idbPut(IMGNS+'a_'+l.id,adec[l.id]); if(audioCache[l.id]) URL.revokeObjectURL(audioCache[l.id]); audioCache[l.id]=URL.createObjectURL(adec[l.id]); l.audio={idb:true}; } }
    for(const [k,b2] of Object.entries(vdec)){ try{ await idbPut(k,b2); }catch(err){} }
    replaceAll(game); toast(`불러왔어요. 이미지 ${Object.keys(imgs).length}개, 음성 ${Object.keys(vdec).length}개 포함`);
  }catch(err){ toast('불러오지 못했어요. 지금 게임은 그대로예요. (저장 공간이나 파일을 확인해 주세요)'); }
});
