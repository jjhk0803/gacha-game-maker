<!doctype html>

<script>
(function(){
  var BUILT='2026.10.08.18'; window.APP_BUILD=BUILT; window.__SHELL__=window.__SHELL__||BUILT;
  function vc(a,b){a=String(a||'').split(/\D+/).map(Number);b=String(b||'').split(/\D+/).map(Number);for(var i=0;i<Math.max(a.length,b.length);i++){var x=a[i]||0,y=b[i]||0;if(x!==y)return x<y?-1:1;}return 0;}
  if(window.__LIVE__) return;
  try{
    if(/[?&]builtin/.test(location.search)) return;
    var m=JSON.parse(localStorage.getItem('starfall-live')||'null');
    if(!m||!m.on) return;
    var h=localStorage.getItem('starfall-live-html'); if(!h) return;
    if(m.build&&vc(m.build,BUILT)<0){ m.on=false; m.superseded=BUILT; localStorage.setItem('starfall-live',JSON.stringify(m)); return; }
    m.boots=(m.boots||0)+1;
    if(m.boots>3){ m.on=false; m.failed=true; m.badBuild=m.build; m.boots=0; localStorage.setItem('starfall-live',JSON.stringify(m)); return; }
    localStorage.setItem('starfall-live',JSON.stringify(m));
    window.__LIVE__=m.build||'live';
    document.write(h.replace(/<\/html>\s*$/i,'')+'<plaintext style="display:none">');
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="가챠 메이커">
<title>가챠 게임 메이커</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Rajdhani:wght@500;700&family=Nanum+Myeongjo:wght@700;800&family=Cinzel:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2eef7; --bg2:#e4dcef; --panel:#ffffff; --panel2:#f6f2fb; --line:#d8cfe6; --ink:#221b33; --sub:#6c6385;
  --rose:#d92f5a; --rose-ink:#fff; --brass:#a87a0c; --e1:#e04646; --e2:#2fa86a; --e3:#2f7fe0;
  --shade:rgba(30,20,50,.55);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15121f; --bg2:#21192f; --panel:#221d33; --panel2:#2c2541; --line:#3d3458; --ink:#f1ecfa; --sub:#a79fc2;
    --rose:var(--rose); --rose-ink:#2a0c16; --brass:#e9b949; --e1:#ff5a5a; --e2:#4fd18b; --e3:#4fa3ff; --shade:rgba(5,3,12,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#15121f; --bg2:#21192f; --panel:#221d33; --panel2:#2c2541; --line:#3d3458; --ink:#f1ecfa; --sub:#a79fc2;
  --rose:var(--rose); --rose-ink:#2a0c16; --brass:#e9b949; --e1:#ff5a5a; --e2:#4fd18b; --e3:#4fa3ff; --shade:rgba(5,3,12,.7);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed;-webkit-tap-highlight-color:transparent;line-height:1.55}
h1,h2,h3,.disp{font-family:"Black Han Sans","Apple SD Gothic Neo",sans-serif;font-weight:400}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
#app{max-width:540px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px}
.brand{font-family:"Black Han Sans",sans-serif;font-size:1.4rem}
.wallet{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);padding:5px 12px;border-radius:999px;font-weight:600}
.gem{color:var(--brass)}
main{flex:1;overflow-y:auto;padding:4px 14px 100px}
.tabs{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--panel);border-top:1px solid var(--line);z-index:20}
.tabs-in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{padding:10px 0 12px;color:var(--sub);font-family:"Black Han Sans",sans-serif;font-size:1.02rem}
.tab[aria-current="true"]{color:var(--rose)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;background:var(--rose);color:var(--rose-ink);font-weight:600}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:.88rem;border-radius:10px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.panel h3{margin:0 0 6px;font-size:1.15rem}
.muted{color:var(--sub);font-size:.9rem}
.badge{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:6px;border:1px solid currentColor;line-height:1.5}
.r3c{color:var(--brass)} .r2c{color:#9a7bff} .r1c{color:var(--sub)}
.b19{color:#fff;background:#d4204a;border-color:#d4204a}
.el{display:inline-flex;align-items:center;justify-content:center;min-width:1.5em;width:auto;height:1.5em;padding:0 .42em;box-sizing:border-box;white-space:nowrap;line-height:1;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.45);font-size:.75rem;font-weight:600;color:#fff;background:var(--ec)}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--rose)}
.art{display:block}
img.art{object-fit:contain;object-position:bottom center}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(165deg,color-mix(in srgb,var(--ec) 40%,var(--panel2)),var(--panel2));color:var(--ink);text-align:center}
.ph span{font-family:"Black Han Sans",sans-serif;font-size:3.2rem;opacity:.85;line-height:1}
.ph small{font-size:.7rem;color:var(--sub);margin-top:4px}

/* lobby */
.lobby-stage{position:relative;height:min(62vh,580px);display:flex;justify-content:center;align-items:flex-end;width:100%;overflow:hidden;border-radius:18px;margin-top:4px;cursor:pointer}
.lobby-stage .shade{position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(10,6,20,.55))}
.vname{position:absolute;left:4px;top:8px;writing-mode:vertical-rl;font-family:"Black Han Sans",sans-serif;font-size:clamp(46px,13vw,80px);line-height:1;color:#fff;opacity:.25;pointer-events:none;white-space:nowrap;z-index:1}
.lobby-art{position:relative;height:100%;width:100%;z-index:1}
img.lobby-art{transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite alternate}
@keyframes breathe{to{transform:scale(1.012) translateY(-2px)}}
.lobby-art.react{animation:react .35s}
@keyframes react{30%{transform:translateY(6px) scale(.99)}}
.ph.lobby-art{width:62%;height:86%;border-radius:20px 20px 0 0}
.phbtn{position:absolute;top:10px;right:10px;z-index:3;width:48px;height:48px;border-radius:14px;background:var(--rose);color:var(--rose-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.phbtn svg{width:24px;height:24px}
.nbadge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#fff;color:#d4204a;font-size:.72rem;font-weight:600;display:flex;align-items:center;justify-content:center}
.nbadge:empty{display:none}
.bubble{position:relative;margin:-30px 10px 10px;z-index:2;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--rose);border-radius:4px 14px 14px 14px;padding:10px 14px;min-height:3em}
.bubble.pop{animation:pop .22s}
@keyframes pop{from{transform:translateY(4px);opacity:.4}}
.lobby-name{display:flex;justify-content:space-between;align-items:baseline;margin:2px 4px 6px}
.lobby-name h2{margin:0;font-size:1.5rem}
.float{position:fixed;pointer-events:none;font-weight:600;color:var(--rose);font-size:1.2rem;animation:up .8s ease-out forwards;z-index:70}
@keyframes up{to{transform:translateY(-44px);opacity:0}}
.empty{text-align:center;padding:48px 12px}

/* ops */
.chap{margin:12px 0 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chap h2{margin:0;font-size:1.25rem}
.stage{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.stage .code{font-family:"Black Han Sans",sans-serif;font-size:1.25rem;min-width:2.6em;color:var(--rose)}
.stage .t{flex:1}
.stage .t b{display:block}
.stage .st{font-size:.8rem;color:var(--sub)}
.stage.lock{opacity:.45}
.stage.clear .code{color:var(--brass)}

/* contract */
.banner{position:relative;border-radius:18px;overflow:hidden;color:#fff;padding:16px 16px 0;margin-top:6px;min-height:260px}
.banner .bgl{position:absolute;inset:0;filter:brightness(.55)}
.banner h1{margin:0;font-size:2rem;line-height:1.1;position:relative;z-index:2}
.banner p{margin:6px 0 0;opacity:.9;font-size:.88rem;position:relative;z-index:2;max-width:55%}
.banner .trio{position:absolute;right:0;bottom:0;height:90%;width:72%;display:flex;justify-content:flex-end;align-items:flex-end;z-index:1}
.banner .trio .art{height:100%;width:auto;max-width:50%;margin-left:-14%}
.banner .trio .ph{width:34%;height:80%;border-radius:12px 12px 0 0;opacity:.8}
.pullrow{display:grid;grid-template-columns:1fr 1.3fr;gap:10px;margin-top:10px}
.pullrow .btn{flex-direction:column;padding:12px 8px;gap:0}
.pullrow .btn small{font-weight:400;font-size:.8rem;opacity:.9}

/* grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cc{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--panel2);border:2px solid var(--line);text-align:left}
.cc.r3{border-color:var(--brass)} .cc.r2{border-color:#9a7bff}
.cc .art{position:absolute;inset:0;width:100%;height:100%}
.cc img.art{object-fit:contain;object-position:50% 100%;inset:4px 0 0}
.cc .lbl{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;background:linear-gradient(transparent,rgba(10,6,20,.85));color:#fff;font-size:.8rem}
.cc .lbl b{display:block;font-size:.9rem}
.cc.off .art{filter:grayscale(1) brightness(.55)}
.cc .el{position:absolute;top:5px;left:5px}
.lgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.lt{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--panel2);aspect-ratio:16/10;text-align:left}
.lt.prop{aspect-ratio:1}
.lt .art{position:absolute;inset:0;width:100%;height:100%}
.lt img.art{object-fit:cover;object-position:center}
.lt .bgfill{position:absolute;inset:0}
.lt .lbl{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 5px;background:linear-gradient(transparent,rgba(10,6,20,.85));color:#fff;font-size:.82rem}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden],.ov[hidden],#phone[hidden]{display:none}
.sheet{width:100%;max-width:540px;max-height:94%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);animation:sheet .25s ease-out}
@keyframes sheet{from{transform:translateY(30px);opacity:0}}
.sheet h2{margin:0 0 4px;font-size:1.45rem}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.x{font-size:1.4rem;line-height:1;padding:4px 8px;color:var(--sub)}
.bigart{height:min(52vh,460px);display:flex;justify-content:center;align-items:flex-end;background:radial-gradient(ellipse at 50% 80%,color-mix(in srgb,var(--ec) 25%,transparent),transparent 70%);border-radius:14px;overflow:hidden}
.bigart .art{height:100%;width:100%}
.bigart .ph{width:60%;border-radius:14px 14px 0 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:8px 0}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 2px;font-size:.78rem;color:var(--sub)}
.stats b{display:block;color:var(--ink);font-size:1rem}
.ep{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin:6px 0}
.ep .t{flex:1;min-width:0}
.ep .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep.lock{opacity:.55}
.code-box{font-size:.8rem;background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;word-break:break-word;font-family:ui-monospace,Menlo,monospace}
label.f{display:block;font-size:.85rem;color:var(--sub);margin:10px 0 4px}
.in,textarea.in,select.in{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--ink)}
textarea.in{min-height:90px;resize:vertical;line-height:1.5}
textarea.in.tall{min-height:260px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:.88rem}
.chip.on{background:var(--rose);color:var(--rose-ink);border-color:var(--rose)}
.stage-edit{border:1px solid var(--line);border-radius:14px;padding:4px 12px 12px;margin:12px 0;background:var(--panel)}
.slider{margin:10px 0}
.slider label{display:flex;justify-content:space-between;font-size:.92rem}
.slider input{width:100%;accent-color:var(--rose)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:90;max-width:88%;text-align:center;animation:pop .2s}

/* overlay base */
.ov{position:fixed;inset:0;z-index:40;background:#07050d;color:#f1ecfa;overflow:hidden}
.shoot{position:absolute;width:160px;height:2px;background:linear-gradient(90deg,transparent,#fff);transform-origin:100% 50%;opacity:0;animation:shoot 4.2s linear infinite;pointer-events:none}
@keyframes shoot{0%{transform:translate(0,0) rotate(-35deg);opacity:0}4%{opacity:1}22%{transform:translate(-420px,300px) rotate(-35deg);opacity:0}100%{opacity:0}}
.skipb{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:9;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);padding:6px 12px;border-radius:9px;font-size:.82rem;color:#fff}

/* title */
.title{position:absolute;inset:0;cursor:pointer}
.t-bg{position:absolute;inset:-4%;filter:brightness(.6);animation:kb 22s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.08) translateX(-2%)}}
.t-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,5,13,.85),transparent 60%),linear-gradient(transparent 60%,rgba(7,5,13,.9))}
.t-char{position:absolute;right:-10%;bottom:0;height:92%;width:78%;animation:tchar 1.4s .2s cubic-bezier(.2,1,.3,1) both}
.t-char .art{height:100%;width:100%}
.t-ill{filter:none}.t-ill img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.t-char img.art{object-position:bottom right}
.t-char .ph{width:70%;height:80%;margin-left:auto;border-radius:20px 20px 0 0;opacity:.6}
@keyframes tchar{from{transform:translateX(18%);opacity:0}}
.t-logo{position:absolute;left:7%;top:16%;z-index:2;animation:logo 1.4s .6s both}
@keyframes logo{from{opacity:0;letter-spacing:.3em;filter:blur(8px)}}
.t-kr{font-family:"Black Han Sans",sans-serif;font-size:clamp(64px,19vw,128px);line-height:.92;color:#fff;text-shadow:0 0 34px rgba(255,82,119,.65)}
.t-en{letter-spacing:.42em;font-size:.78rem;color:#e9b949;margin-top:12px}
.t-touch{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);text-align:center;font-size:.95rem;letter-spacing:.2em;z-index:2;animation:blink 1.8s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.t-ver{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center;font-size:.72rem;opacity:.6;z-index:2}

/* opening */
.op{position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,#3b1225,#000 60%);display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;cursor:pointer}
.op-txt{font-size:1.2rem;color:#eee;opacity:0;transition:opacity 1s,transform 1.2s;line-height:1.9;max-width:420px;transform:translateY(8px)}
.op-txt.show{opacity:1;transform:none}
.op-txt.big{font-family:"Black Han Sans",sans-serif;font-size:3.4rem;line-height:1.1;color:#fff;text-shadow:0 0 40px var(--rose)}

/* gacha */
.gc{position:absolute;inset:0;overflow:hidden}
.gc-sky{position:absolute;inset:0;filter:brightness(.4) saturate(1.2)}
.gc-seal{position:absolute;left:50%;top:44%;width:min(82vw,380px);aspect-ratio:1;transform:translate(-50%,-50%);animation:sealin .8s ease-out both;filter:drop-shadow(0 0 10px rgba(233,185,73,.6))}
.gc-seal svg{width:100%;height:100%;animation:spin 14s linear infinite}
.gc-seal.gold{filter:drop-shadow(0 0 24px #ffd35a) drop-shadow(0 0 50px var(--rose))}
.gc-seal.gold svg{animation-duration:3s}
.gc-seal.go{animation:sealout .5s ease-in forwards}
@keyframes sealin{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}}
@keyframes sealout{to{opacity:0;transform:translate(-50%,-50%) scale(1.7)}}
@keyframes spin{to{transform:rotate(360deg)}}
.gc-streak{position:absolute;left:50%;top:44%;width:0;height:0;opacity:0;z-index:3}
.gc-streak.fall{animation:fall 1s cubic-bezier(.45,0,.9,.55) forwards}
@keyframes fall{0%{transform:translate(60vw,-70vh);opacity:1}100%{transform:translate(0,0);opacity:1}}
.gc-streak .core{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 18px 8px var(--sc),0 0 60px 24px var(--sc);transition:box-shadow .3s}
.gc-streak .tail{position:absolute;left:0;top:-2px;width:260px;height:4px;transform-origin:0 50%;transform:rotate(-49deg);background:linear-gradient(90deg,var(--sc),transparent);border-radius:4px;transition:background .3s}
.gc-flash{position:absolute;inset:0;background:var(--fc,#fff);opacity:0;pointer-events:none;z-index:6}
.gc-flash.on{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.gc-stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 52px) 10px calc(env(safe-area-inset-bottom,0px) + 16px);overflow-y:auto;z-index:4}
.pgrid{display:grid;gap:7px;width:100%;max-width:500px}
.pgrid.n1{grid-template-columns:min(260px,66vw);justify-content:center}
.pgrid.n10{grid-template-columns:repeat(5,1fr)}
.pc{perspective:900px;animation:drop .35s backwards;animation-delay:var(--d)}
@keyframes drop{from{transform:translateY(-24px) scale(.9);opacity:0}}
.pin{position:relative;aspect-ratio:3/4;transition:transform .55s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.pc.open .pin{transform:rotateY(180deg)}
.pf,.pb{position:absolute;inset:0;border-radius:10px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pb{display:flex;align-items:center;justify-content:center;font-family:"Black Han Sans",sans-serif;font-size:1.4rem;color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.3)}
.pc.r1 .pb{background:linear-gradient(160deg,#4b6a8f,#1f2a40)}
.pc.r2 .pb{background:linear-gradient(160deg,#9c7bff,#33206e);box-shadow:0 0 12px #9c7bff}
.pc.r3 .pb{background:linear-gradient(160deg,#ffd35a,var(--rose) 60%,#7aaeff);animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 8px #ffd35a}to{box-shadow:0 0 26px #ffd35a,0 0 46px var(--rose)}}
.pf{transform:rotateY(180deg);background:#2c2541}
.pf .art{position:absolute;inset:0;width:100%;height:100%}
.pf img.art{object-fit:cover;object-position:top}
.pf .lbl{position:absolute;left:0;right:0;bottom:0;padding:14px 5px 5px;background:linear-gradient(transparent,rgba(10,6,20,.9));color:#fff;font-size:.8rem;text-align:center}
.n10 .pf .lbl{font-size:.62rem}
.tag{position:absolute;top:4px;right:4px;font-size:.62rem;font-weight:600;padding:1px 5px;border-radius:6px;background:var(--rose);color:#fff;z-index:1}
.tag.d{background:#e9b949;color:#2a1c00}
.cut{position:absolute;inset:0;z-index:8;overflow:hidden;background:#0a0612;cursor:pointer}
.cut-burst{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,var(--rc) 0 5deg,transparent 5deg 15deg);opacity:.28;animation:spin 20s linear infinite}
.cut-band{position:absolute;left:-10%;right:-10%;bottom:16%;height:34%;background:linear-gradient(90deg,var(--rc),transparent 80%);opacity:.35;transform:skewY(-6deg);animation:band .6s .2s both}
@keyframes band{from{transform:skewY(-6deg) translateX(-100%)}}
.cut-art{position:absolute;right:-8%;bottom:0;height:94%;width:82%;animation:artin .8s cubic-bezier(.2,1,.3,1) both}
.cut-art .art{width:100%;height:100%}
.cut-art img.art{object-position:bottom right}
.cut-art .ph{width:70%;height:80%;margin-left:auto;border-radius:20px 20px 0 0}
@keyframes artin{from{transform:translateX(40%);opacity:0}}
.cut-txt{position:absolute;left:6%;right:6%;bottom:calc(env(safe-area-inset-bottom,0px) + 36px);z-index:2}
.cut-r{color:var(--rc);font-weight:600;letter-spacing:.25em;animation:txin .5s .4s both}
.cut-name{font-family:"Black Han Sans",sans-serif;font-size:clamp(52px,15vw,96px);line-height:1;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.7);animation:txin .6s .5s both}
.cut-sub{opacity:.85;font-size:.9rem;animation:txin .6s .6s both}
.cut-line{margin-top:12px;max-width:80%;background:rgba(0,0,0,.6);padding:9px 13px;border-left:3px solid var(--rc);animation:txin .6s .9s both;line-height:1.6}
@keyframes txin{from{transform:translateX(-30px);opacity:0}}

/* story */
.vn{position:absolute;inset:0;overflow:hidden;cursor:pointer}
.vn-bg{position:absolute;inset:0;filter:brightness(.72)}
.vn-bg.fade{animation:bgfade .8s}
@keyframes bgfade{from{opacity:0}}
.vn-char{position:absolute;left:0;right:0;bottom:0;top:8%;display:flex;justify-content:center;align-items:flex-end;transition:filter .25s;z-index:1}
.vn-char .art{height:100%;width:100%}
.vn-char img.art{animation:breathe 3.4s ease-in-out infinite alternate;transform-origin:50% 100%}
.vn-char .ph{width:min(60%,300px);height:80%;border-radius:16px 16px 0 0}
.vn-char.enter{animation:enter .45s ease-out}
@keyframes enter{from{opacity:0;transform:translateX(30px)}}
.vn-char.dim{filter:brightness(.5)}
.vn-prop{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);width:min(56vw,280px);padding:8px;background:rgba(20,14,34,.75);border:1px solid rgba(255,255,255,.35);border-radius:14px;z-index:2;animation:pop .35s;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.vn-prop .art{width:100%;aspect-ratio:1;border-radius:8px;object-fit:contain}
.vn-flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:5}
.vn-flash.w{background:#fff;animation:flash .7s}
.vn-flash.b{background:#000;animation:blk 1.5s}
@keyframes blk{0%{opacity:0}35%,65%{opacity:1}100%{opacity:0}}
.vn.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-9px,4px)}40%{transform:translate(8px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-2px)}}
.vn-top{position:absolute;top:0;left:0;right:0;display:flex;gap:6px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;background:linear-gradient(rgba(0,0,0,.55),transparent);z-index:4}
.vn-top .ttl{flex:1;font-size:.85rem;opacity:.85}
.vn-top button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:5px 10px;border-radius:8px;font-size:.82rem;color:#fff}
.vn-top button.on{background:var(--rose);color:#2a0c16;border-color:var(--rose)}
.vn-place{position:absolute;top:calc(env(safe-area-inset-top,0px) + 54px);left:12px;background:rgba(0,0,0,.55);border-left:3px solid #e9b949;padding:4px 10px;font-size:.85rem;z-index:4}
.vn-place:empty{display:none}
.vn-box{position:absolute;left:0;right:0;bottom:0;padding:16px 18px calc(env(safe-area-inset-bottom,0px) + 24px);background:linear-gradient(transparent,rgba(8,5,16,.93) 20%);min-height:30%;z-index:4}
.vn-in{max-width:640px;margin:0 auto}
.vn-name{font-family:"Black Han Sans",sans-serif;font-size:1.25rem;color:var(--rose);min-height:1.4em}
.vn-text{font-size:1.05rem;line-height:1.75;margin-top:4px;min-height:3.5em}
.vn-text.nar{color:#d6cfe8;font-style:italic}
.vn-choices button{display:block;width:100%;margin-top:8px;padding:11px 14px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.35);color:#fff;text-align:left}
.vn-next{position:absolute;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-size:.8rem;opacity:.7;animation:blink 1.2s infinite}

/* battle */
.bt{position:absolute;inset:0;display:grid;grid-template-rows:auto auto 1fr auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.bt-bg{position:absolute;inset:0;filter:brightness(.35) saturate(1.1);z-index:-1}
.bt-top{display:flex;gap:6px;align-items:center;padding:10px 12px}
.bt-top .ttl{flex:1;font-family:"Black Han Sans",sans-serif}
.bt-top button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);padding:5px 10px;border-radius:8px;font-size:.82rem;color:#fff}
.bt-top button.on{background:var(--rose);border-color:var(--rose);color:#2a0c16}
.bt-en{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:6px 10px}
.eu{position:relative;width:calc(33% - 8px);max-width:150px;background:rgba(10,6,20,.55);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:8px;text-align:center;transition:opacity .3s}
.eu.boss{width:calc(50% - 8px);max-width:220px;border-color:var(--rose)}
.eu b{display:block;font-size:.82rem;margin:4px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eu .shape{height:46px;display:flex;align-items:center;justify-content:center}
.eu .shape i{width:32px;height:32px;transform:rotate(45deg);background:var(--ec);opacity:.85;box-shadow:0 0 18px var(--ec);animation:hover 2s ease-in-out infinite alternate}
@keyframes hover{to{transform:rotate(45deg) translate(-3px,-3px)}}
.eu.boss .shape i{width:46px;height:46px}
.hpb{height:6px;background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden}
.hpb i{display:block;height:100%;background:#4fd18b;transition:width .2s}
.eu .hpb i{background:#ff5a5a}
.shb{height:3px;margin-top:2px;border-radius:9px;overflow:hidden}
.shb i{display:block;height:100%;background:#7fc4ff;transition:width .2s}
.gg{height:3px;margin-top:3px;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden}
.gg i{display:block;height:100%;background:#e9b949}
.dead{opacity:.25}
.bt-log{overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 14px;font-size:.78rem;color:#cfc6e8;gap:2px;-webkit-mask-image:linear-gradient(transparent,#000 40%)}
.bt-al{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 8px 10px}
.au{position:relative;background:rgba(10,6,20,.6);border:1px solid rgba(255,255,255,.16);border-radius:12px;overflow:hidden;transition:opacity .3s}
.au-art{height:88px;overflow:hidden;position:relative}
.au-art .art{width:100%;height:100%}
.au-art img.art{object-fit:cover;object-position:top}
.au-art .ph span{font-size:2rem}
.au-art .ph small{display:none}
.au .meta{padding:4px 5px 0}
.skill{display:block;width:calc(100% - 10px);margin:5px;padding:6px 2px;border-radius:8px;background:rgba(255,255,255,.08);color:#9c94b8;font-size:.7rem;line-height:1.25}
.skill small{display:block;font-size:.65rem}
.skill.ready{background:var(--rose);color:#2a0c16;font-weight:600;animation:rdy 1s ease-in-out infinite alternate}
@keyframes rdy{to{box-shadow:0 0 12px var(--rose)}}
.dmg{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-weight:600;font-size:1rem;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none;animation:dmg .7s ease-out forwards;z-index:3;white-space:nowrap}
.dmg.heal{color:#7dffb0} .dmg.crit{color:#ffd35a;font-size:1.25rem}
@keyframes dmg{to{transform:translate(-50%,-30px);opacity:0}}
.cutin{position:absolute;left:0;right:0;top:34%;height:120px;pointer-events:none;display:none;z-index:5}
.cutin.show{display:block;animation:cut .8s ease-out forwards}
.cutin .strip{position:absolute;inset:0;background:linear-gradient(100deg,transparent 4%,var(--rose) 4% 96%,transparent 96%);transform:skewY(-4deg);overflow:hidden}
.cutin .strip .art{position:absolute;right:4%;top:-30%;height:260%;width:55%}
.cutin .strip img.art{object-fit:cover;object-position:top}
.cutin .nm{position:absolute;left:8%;top:50%;transform:translateY(-50%);font-family:"Black Han Sans",sans-serif;font-size:1.9rem;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}
@keyframes cut{0%{transform:translateX(-100%)}18%{transform:translateX(0)}80%{transform:translateX(0);opacity:1}100%{transform:translateX(30%);opacity:0}}
.result{position:absolute;inset:0;background:rgba(8,5,16,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;z-index:6}
.result h2{font-size:2.4rem;margin:0}

/* phone */
#phone{position:fixed;inset:0;z-index:45;background:var(--shade);display:flex;justify-content:center}
.phone{width:100%;max-width:460px;height:100%;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:sheet .25s ease-out}
.ph-top{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--rose);color:var(--rose-ink)}
.ph-top b{flex:1;text-align:center;font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:1.15rem}
.ph-top button{width:30px;height:30px;font-size:1.3rem;line-height:1}
.ph-list{flex:1;overflow-y:auto}
.ph-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
.ph-row .t{flex:1;min-width:0}
.ph-row .t b{display:block}
.ph-row .t span{display:block;color:var(--sub);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;background:var(--rose);flex:none}
.av{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;position:relative;background:var(--panel2);border:1px solid var(--line)}
.av.sm{width:34px;height:34px}
.av .art{width:100%;height:100%}
.av img.art{object-fit:cover;object-position:50% 0;transform:scale(2.4);transform-origin:50% 0}
.av .ph span{font-size:1.1rem}
.av .ph small{display:none}
.ph-chat{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:7px;background:var(--bg2)}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:86%;animation:pop .2s}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bub{background:var(--panel);border:1px solid var(--line);padding:8px 12px;border-radius:4px 16px 16px 16px;line-height:1.5;word-break:break-word;white-space:pre-wrap}
.me .bub{background:var(--rose);color:var(--rose-ink);border-color:transparent;border-radius:16px 4px 16px 16px}
.bub.photo{padding:4px;width:190px}
.bub.photo .art{width:100%;aspect-ratio:4/3;border-radius:10px;object-fit:cover}
.bub.typing{display:flex;gap:4px;padding:12px}
.bub.typing i{width:6px;height:6px;border-radius:50%;background:var(--sub);animation:td 1s infinite}
.bub.typing i:nth-child(2){animation-delay:.15s}.bub.typing i:nth-child(3){animation-delay:.3s}
@keyframes td{50%{transform:translateY(-4px);opacity:.4}}
.sys{align-self:center;font-size:.78rem;color:var(--sub);background:var(--panel);padding:2px 10px;border-radius:99px;text-align:center}
.ph-in{padding:10px;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-height:56px;justify-content:center}
#notif{position:fixed;left:0;right:0;top:0;z-index:85;display:flex;justify-content:center;pointer-events:none}
.nt{pointer-events:auto;margin-top:calc(env(safe-area-inset-top,0px) + 8px);width:min(94%,440px);background:rgba(28,24,44,.96);color:#fff;border-radius:18px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 34px rgba(0,0,0,.4);text-align:left;animation:ntin .45s cubic-bezier(.2,1.3,.4,1)}
.nt .av{border-color:rgba(255,255,255,.2)}
.nt-t{flex:1;min-width:0}
.nt-t small{display:block;opacity:.65;font-size:.72rem}
.nt-t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9rem;opacity:.9}
.nt.out{animation:ntout .3s forwards}
@keyframes ntin{from{transform:translateY(-120%)}}
@keyframes ntout{to{transform:translateY(-130%);opacity:0}}
.gate{position:fixed;inset:0;z-index:95;background:#07050d;color:#f1ecfa;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:14px}
.gate .mark{width:76px;height:76px;border-radius:50%;border:5px solid #d4204a;display:flex;align-items:center;justify-content:center;font-family:"Black Han Sans",sans-serif;font-size:2rem;color:#fff}
.naiprev{position:relative;margin:12px auto 0;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;background-color:#2c2541;background-image:linear-gradient(45deg,rgba(255,255,255,.06) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.06) 75%),linear-gradient(45deg,rgba(255,255,255,.06) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.06) 75%);background-size:24px 24px;background-position:0 0,12px 12px}
.naiprev.char{aspect-ratio:832/1216;width:min(100%,41vh)}
.naiprev.bg{aspect-ratio:1216/832;width:100%}
.naiprev.prop{aspect-ratio:1;width:min(100%,360px)}
.naiprev img{width:100%;height:100%;object-fit:contain}
.naiprev.picking img{cursor:crosshair;touch-action:manipulation}
.naiprev.zoom{display:block;overflow:auto;-webkit-overflow-scrolling:touch}
.naiprev.zoom img{width:240%;height:auto;max-width:none;display:block}
.cuttools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cuttools .btn{flex:1 1 auto;padding-left:10px;padding-right:10px}
.cuttools .btn.on{background:var(--acc,#ffb400);color:#111}
.cutpick-hint{font-size:12px;margin-top:6px}
.cutsw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid rgba(255,255,255,.4);vertical-align:-2px;margin-right:4px}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:var(--rose);animation:spin .9s linear infinite}

/* ===== v3 theme: tactical (default) + skins ===== */
:root[data-skin]{--acc:#ffb400;--rose:var(--acc);--rose-ink:#16120a;--brass:#e9c46a;--grid:rgba(255,255,255,.035);--hd:"IBM Plex Sans KR",sans-serif;--en:"Rajdhani","IBM Plex Sans KR",sans-serif;--cut:10px}
:root[data-skin="tactical"]{--bg:#14161a;--bg2:#1a1d22;--panel:rgba(31,34,40,.94);--panel2:#262a31;--line:#3a3f48;--ink:#e9eaec;--sub:#949aa5;--shade:rgba(5,6,8,.72)}
:root[data-skin="noir"]{--bg:#0e0e0e;--bg2:#161616;--panel:rgba(24,24,24,.95);--panel2:#202020;--line:#3a3a3a;--ink:#f2f2f2;--sub:#9a9a9a;--shade:rgba(0,0,0,.75);--grid:rgba(255,255,255,.025)}
:root[data-skin="neon"]{--bg:#0b0b16;--bg2:#12122a;--panel:rgba(20,20,44,.92);--panel2:#1c1c3a;--line:#34346a;--ink:#eef0ff;--sub:#9a9cc8;--shade:rgba(4,4,14,.75);--grid:rgba(120,140,255,.06)}
:root[data-skin="fantasy"]{--bg:#18120c;--bg2:#221a12;--panel:rgba(40,31,22,.94);--panel2:#33281c;--line:#5c4a33;--ink:#f3e8d2;--sub:#bba98a;--shade:rgba(10,6,2,.72);--grid:rgba(255,220,160,.03);--hd:"Nanum Myeongjo",serif;--en:"Cinzel",serif;--cut:4px}
:root[data-skin="pastel"]{--bg:#f6f1f8;--bg2:#ece4f2;--panel:rgba(255,255,255,.95);--panel2:#f8f4fb;--line:#dccfe6;--ink:#2c2440;--sub:#7a6f90;--shade:rgba(40,30,60,.45);--grid:rgba(120,90,160,.06);--rose-ink:#fff;--cut:14px}
body{background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed}
h1,h2,h3,.disp{font-family:var(--hd);font-weight:700}
.top{padding:8px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--bg2),transparent)}
.brand{font-family:var(--hd);font-weight:700;font-size:1.15rem;display:flex;flex-direction:column;line-height:1.1}
.brand i{font-style:normal;font-family:var(--en);font-size:.62rem;letter-spacing:.28em;color:var(--rose);font-weight:700}
.res{display:flex;gap:6px}
.res span{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);padding:4px 10px 4px 8px;font-size:.85rem;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.res .r-gem{color:var(--rose)} .res .r-gold{color:var(--brass)} .res b{color:var(--ink);font-weight:600}
.tabs{background:var(--bg2);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 0 10px;position:relative;font-family:var(--hd)}
.tab b{font-size:.92rem;font-weight:700}
.tab i{font-style:normal;font-family:var(--en);font-size:.58rem;letter-spacing:.2em;opacity:.7}
.tab[aria-current="true"]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--rose)}
.panel{clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)));border-left:3px solid var(--rose);border-radius:0}
.btn{border-radius:0;clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));font-family:var(--hd);letter-spacing:.02em}
.btn.ghost{border:1px solid var(--line)}
.chip{border-radius:0;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);padding:5px 14px}
.chip.has{border-color:var(--rose)}
.in,textarea.in,select.in{border-radius:0}
.sheet{border-radius:0;border-top:3px solid var(--rose)}
.sheet h2{font-family:var(--hd)}
.ep{border-radius:0;border-left:2px solid var(--line)}
.ep.disp{align-items:flex-start}
.ep .t span{display:block}
.stage{border-radius:0;border-left:3px solid var(--line);clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.stage.clear{border-left-color:var(--rose)}
.stage .code{font-family:var(--en);font-weight:700;color:var(--rose)}
.stage>.btn{flex:none}
.phead{display:flex;align-items:center;gap:10px;margin:6px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.phead i{display:block;font-style:normal;font-family:var(--en);font-size:.7rem;letter-spacing:.32em;color:var(--rose);font-weight:700}
.phead h2{margin:0;font-size:1.4rem;line-height:1.15}
.phead .back{width:34px;height:34px;font-size:1.5rem;color:var(--ink);border:1px solid var(--line);background:var(--panel)}
.sec{font-family:var(--hd);font-size:1rem;margin:16px 0 6px;padding-left:8px;border-left:3px solid var(--rose)}
.chap h3{margin:0;font-size:1.05rem}
/* lobby */
body.on-lobby main{padding:0 0 70px}
.lobby{position:relative;height:calc(100dvh - 128px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:520px;overflow:hidden}
.lb-stage{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-start;background-size:cover;background-position:center}
.lb-stage .lobby-art{position:absolute;left:-12%;bottom:0;height:96%;width:88%;z-index:1}
.lb-stage img.lobby-art{object-position:bottom center}
.lb-stage .ph.lobby-art{left:6%;width:52%;height:78%}
.lb-shade{position:absolute;inset:0;background:linear-gradient(90deg,transparent 45%,rgba(10,11,14,.72) 78%),linear-gradient(transparent 62%,rgba(10,11,14,.85));z-index:1;pointer-events:none}
.lb-id{position:absolute;left:14px;top:12px;z-index:2;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.lb-id i{display:block;font-style:normal;font-family:var(--en);font-size:.68rem;letter-spacing:.3em;color:var(--rose);font-weight:700}
.lb-id b{display:block;font-family:var(--hd);font-size:1.9rem;line-height:1.1}
.lb-id span{font-size:.82rem;opacity:.85}
.lb-menu{position:absolute;right:10px;top:12px;bottom:84px;width:min(44%,190px);z-index:3;display:flex;flex-direction:column;gap:6px;overflow-y:auto;scrollbar-width:none}
.tile{position:relative;text-align:right;padding:9px 14px 8px;background:rgba(18,20,24,.78);border-right:3px solid var(--rose);color:#fff;clip-path:polygon(12px 0,100% 0,100% 100%,0 100%,0 12px);backdrop-filter:blur(4px)}
.tile b{display:block;font-family:var(--hd);font-size:1rem;font-weight:700}
.tile i{display:block;font-style:normal;font-family:var(--en);font-size:.62rem;letter-spacing:.25em;opacity:.65}
.tile em{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-style:normal;font-family:var(--en);font-weight:700;font-size:.78rem;background:var(--rose);color:var(--rose-ink);padding:1px 6px}
.tile.hot{border-right-color:#ff5a5a}
.lobby .bubble{position:absolute;left:10px;right:calc(min(44%,190px) + 20px);bottom:12px;margin:0;z-index:3;background:rgba(18,20,24,.86);color:#fff;border:1px solid rgba(255,255,255,.12);border-left:3px solid var(--rose);border-radius:0}
:root[data-skin="pastel"] .tile,:root[data-skin="pastel"] .lobby .bubble{background:rgba(255,255,255,.85);color:var(--ink)}
.lobby-art.react{animation:react .35s}
/* banners */
.bsel{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.bsel button{flex:none;padding:7px 14px;background:var(--panel);border:1px solid var(--line);font-size:.85rem;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.bsel button.on{background:var(--rose);color:var(--rose-ink);border-color:var(--rose)}
.banner{border-radius:0;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));background:#111}
.banner .bgl{filter:brightness(.5)}
.bn-t{position:relative;z-index:2;max-width:58%}
.bn-t i{font-style:normal;font-family:var(--en);font-size:.7rem;letter-spacing:.3em;color:var(--rose);font-weight:700}
.bn-t h1{font-family:var(--hd);font-size:1.7rem;margin:2px 0}
.bn-t .ups b{color:var(--rose);margin-right:4px}
/* cards */
.cc{border-radius:0;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
.cc .lbl i{display:block;font-style:normal;font-family:var(--en);font-size:.6rem;letter-spacing:.15em;opacity:.8}
.cc .dup{position:absolute;top:5px;right:5px;font-size:.62rem;color:var(--rose);text-shadow:0 1px 2px #000}
.cc .busy{position:absolute;top:28px;left:5px;font-size:.6rem;background:#000a;color:#fff;padding:1px 5px}
.lvrow{display:flex;justify-content:space-between;gap:8px;margin:10px 0 4px;font-size:.88rem}
.lvrow b{font-family:var(--en);font-size:1.2rem;color:var(--rose)}
.wthumb{width:56px;height:56px;flex:none;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.wthumb img{width:100%;height:100%;object-fit:contain}
.facegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:8px}
.fc{position:relative;aspect-ratio:3/4;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.fc img{width:100%;height:100%;object-fit:cover;object-position:50% 8%;transform:scale(1.6);transform-origin:50% 0}
.fc span{position:absolute;left:0;right:0;bottom:0;font-size:.62rem;background:#000a;color:#fff;text-align:center}
.file{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--rose);padding:8px 10px;margin:6px 0;font-size:.9rem;line-height:1.6}
.file i{display:block;font-style:normal;font-family:var(--en);font-size:.65rem;letter-spacing:.25em;color:var(--rose)}
.file.lock{opacity:.5}
/* events */
.evcard{position:relative;display:block;width:100%;min-height:150px;margin:10px 0;overflow:hidden;text-align:left;color:#fff;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);background:#111}
.evcard .bgl{position:absolute;inset:0;filter:brightness(.55)}
.evcard.off{opacity:.55}
.ev-t{position:relative;z-index:1;padding:16px;display:flex;flex-direction:column;gap:2px;max-width:80%}
.ev-t i{font-style:normal;font-family:var(--en);font-size:.68rem;letter-spacing:.3em;color:var(--rose);font-weight:700}
.ev-t b{font-family:var(--hd);font-size:1.4rem}
.ev-t span{font-size:.85rem;opacity:.9}
.ev-t em{font-style:normal;margin-top:6px;font-size:.82rem;color:var(--brass)}
/* pass */
.passgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.pv{background:var(--panel);border:1px solid var(--line);padding:6px 4px;text-align:center;font-size:.62rem;line-height:1.3;min-height:66px}
.pv i{display:block;font-style:normal;font-family:var(--en);font-weight:700;font-size:1rem;color:var(--sub)}
.pv.ok{border-color:var(--rose)} .pv.ok i{color:var(--rose)}
.pv.got{opacity:.4}
/* story phone */
.vn-phone{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);transform:translateX(-50%);width:min(86vw,340px);height:min(58vh,480px);background:#f3f1f6;border:6px solid #1c1c22;border-radius:26px;z-index:3;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);color:#222}
.vn-phone[hidden]{display:none}
.vp-top{background:var(--rose);color:var(--rose-ink);text-align:center;padding:9px;font-family:var(--hd);font-weight:700}
.vp-body{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.vp-body .bub{background:#fff;color:#222;border:1px solid #ddd}
.vp-body .me .bub{background:var(--rose);color:var(--rose-ink)}
/* line popup */
.linepop{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);z-index:88;width:min(92%,440px);display:flex;gap:10px;align-items:center;background:rgba(18,20,24,.95);color:#fff;border-left:3px solid var(--rose);padding:8px 12px 8px 8px;animation:pop .25s}
.lp-art{width:56px;height:56px;flex:none;overflow:hidden;background:#222}
.lp-art .art{width:100%;height:100%}
.lp-art img.art{object-fit:cover;object-position:50% 5%;transform:scale(2);transform-origin:50% 0}
.lp-art .ph span{font-size:1.4rem}.lp-art .ph small{display:none}
.lp-t b{display:block;font-size:.85rem;color:var(--rose)}
.lp-t span{font-size:.92rem;line-height:1.5}
.bt-top .ttl i{display:block;font-style:normal;font-family:var(--en);font-size:.6rem;letter-spacing:.3em;color:var(--rose)}
.title .t-kr{font-family:var(--hd)}
.title .t-en{font-family:var(--en);color:var(--rose)}
.ph{background:linear-gradient(165deg,color-mix(in srgb,var(--ec) 35%,var(--panel2)),var(--panel2))}

.chap .btn,.row .btn.sm{white-space:nowrap}
.cc .ph small{display:none}
#livebar{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 54px);transform:translateX(-50%);z-index:86;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--rose);padding:6px 12px;font-size:.82rem;max-width:92%;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.notice{margin:6px 0 0;padding-left:18px;line-height:1.7}
.vn-cg{position:absolute;inset:0;z-index:2;background:#000;overflow:hidden}
.vn-cg[hidden]{display:none}
.vn-cg .art{width:100%;height:100%;object-fit:cover}
.vn-cg.in{animation:bgfade .8s}
.optbox{border:1px solid var(--line);border-left:3px solid var(--rose);padding:6px 10px 10px;margin-top:10px;background:var(--panel2)}
.cgrow{margin-top:6px}
.cgslot{align-items:end}
.naiprev.cg{aspect-ratio:1216/832;width:100%}
.en-img{display:block;width:100%;height:84px;object-fit:contain;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--ec) 60%,transparent));animation:hover 2.4s ease-in-out infinite alternate}
.eu.boss .en-img{height:130px}
.eu.hasimg{background:linear-gradient(transparent 40%,rgba(10,6,20,.6))}
.eu.hit .en-img,.eu.hit .shape{animation:ehit .25s}
@keyframes ehit{30%{transform:translateX(-6px);filter:brightness(2)}60%{transform:translateX(5px)}}
.fenemy{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.fe{position:relative;flex:none;width:84px;background:var(--panel2);border:1px solid var(--line);border-bottom:2px solid var(--ec);padding:4px;text-align:center;font-size:.72rem}
.fe.boss{width:112px;border-color:var(--rose)}
.fe-art{height:70px;display:flex;align-items:center;justify-content:center}
.fe.boss .fe-art{height:92px}
.fe-art .en-img{height:100%;animation:none}
.fe-art .shape i{width:26px;height:26px;transform:rotate(45deg);display:block;background:var(--ec);box-shadow:0 0 12px var(--ec)}
.fe .el{position:absolute;top:3px;left:3px}
.fe b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fe span{color:var(--sub)}
.fpower{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:10px 0 6px;background:var(--panel2);border:1px solid var(--line);padding:8px 10px}
.fpower i{display:block;font-style:normal;font-size:.72rem;color:var(--sub)}
.fpower b{font-family:var(--en);font-size:1.4rem}
.fpower .ok{color:#4fd18b} .fpower .warn{color:#e9b949} .fpower .bad{color:#ff5a5a}
.fbar{grid-column:1/-1;height:5px;background:var(--line);overflow:hidden}
.fbar span{display:block;height:100%} .fbar .ok{background:#4fd18b} .fbar .warn{background:#e9b949} .fbar .bad{background:#ff5a5a}
.fslots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fslot{position:relative;aspect-ratio:3/4.4;background:var(--panel2);border:1px solid var(--line);border-bottom:3px solid var(--ec,var(--line));overflow:hidden;text-align:left;padding:0}
.fslot.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;border-style:dashed;color:var(--sub)}
.fslot.empty span{font-size:1.6rem;line-height:1}
.fslot.empty i{font-style:normal;font-size:.7rem}
.fs-art{position:absolute;inset:0}
.fs-art .art{width:100%;height:100%}
.fs-art img.art{object-fit:cover;object-position:top}
.fs-art .ph small{display:none}
.fslot .el,.fr .el{position:absolute;top:4px;left:4px;z-index:1}
.fslot em,.fr em{position:absolute;top:4px;right:4px;z-index:1;font-style:normal;font-size:.62rem;font-weight:700;padding:1px 5px;color:#fff}
em.adv{background:#2f9e63} em.dis{background:#c0394f} em.busy{background:#555} em.num{background:var(--rose);color:var(--rose-ink);left:auto}
.fr em.num{top:auto;bottom:34px}
.fs-t{position:absolute;left:0;right:0;bottom:0;padding:14px 5px 4px;background:linear-gradient(transparent,rgba(8,8,12,.92));color:#fff;font-size:.68rem;line-height:1.3}
.fs-t b{display:block;font-size:.82rem}
.fs-t span{display:block;opacity:.85}
.fs-t .pw{color:var(--rose);font-family:var(--en);font-weight:700;opacity:1}
.fbonus{margin:6px 0 0;font-size:.82rem;color:#4fd18b}
.ftools{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:12px}
.ftools .chips{flex:1;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
.ftools .chip{flex:none;padding:4px 10px;font-size:.8rem}
.froster{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.fr{position:relative;background:var(--panel2);border:1px solid var(--line);border-bottom:2px solid var(--ec);padding:0;text-align:center;overflow:hidden;font-size:.68rem}
.fr.on{outline:2px solid var(--rose);outline-offset:-2px}
.fr.busy{opacity:.4}
.fr-art{height:74px;overflow:hidden}
.fr-art .art{width:100%;height:100%}
.fr-art img.art{object-fit:cover;object-position:top}
.fr-art .ph span{font-size:1.6rem}.fr-art .ph small{display:none}
.fr b{display:block;font-size:.78rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr span{display:block;color:var(--sub);padding-bottom:4px}
.frow{display:grid;grid-template-columns:1fr 1fr;margin-top:10px;font-size:.7rem;color:var(--sub);text-align:center}
.frow i{font-style:normal;border-bottom:1px solid var(--line);padding-bottom:2px;margin:0 3px}
.lt.enemy{aspect-ratio:1}
.lt.enemy img.art{object-fit:contain;background:var(--panel2)}

/* ===== 2026.10.06.9 : lobby / nav / char screen / pickup / shops ===== */
/* cut tool */
.cutbox{position:relative;margin-top:10px}
.cutview{position:relative;height:min(60vh,600px);overflow:hidden;background-color:#2c2541;background-image:linear-gradient(45deg,rgba(255,255,255,.07) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.07) 75%),linear-gradient(45deg,rgba(255,255,255,.07) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.07) 75%);background-size:20px 20px;background-position:0 0,10px 10px;border:1px solid var(--line)}
.cutview canvas{display:block;width:100%;height:100%;object-fit:contain;touch-action:none;cursor:crosshair}
.cutview.zoom{overflow:auto}
.cutview.zoom canvas{height:auto;max-width:none;image-rendering:pixelated}
.cut-cur{position:absolute;pointer-events:none;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #000;z-index:2}
.cut-cur::before,.cut-cur::after{content:"";position:absolute;background:#ff3d7f}
.cut-cur::before{left:50%;top:-8px;bottom:-8px;width:1px}
.cut-cur::after{top:50%;left:-8px;right:-8px;height:1px}
.cut-cur.brush{border-color:#ffd35a}.cut-cur.restore{border-color:#7fd8ff}
.cut-cur.brush::before,.cut-cur.brush::after,.cut-cur.restore::before,.cut-cur.restore::after{display:none}
.cut-loupe{position:absolute;left:6px;top:6px;z-index:3;width:150px;height:150px;border:2px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.6);image-rendering:pixelated;pointer-events:none;background:#2c2541}
.cut-loupe.right{left:auto;right:6px}
.cuttools{display:grid;grid-template-columns:1fr auto auto;gap:6px;margin-top:8px}
.cutpad{display:flex;gap:8px;align-items:center;margin-top:8px}
.cutpad .pad{display:grid;grid-template-columns:repeat(4,38px);gap:4px}
.cutpad .pad .btn{padding:8px 0}
.cutgo{flex:1;padding:12px 8px}
.cutauto{margin-top:8px;border:1px solid var(--line);padding:8px 10px;background:var(--panel)}
.cutauto summary{cursor:pointer;font-weight:600}
.cutsave{position:sticky;bottom:-18px;margin:12px -16px -18px;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--bg);border-top:1px solid var(--line);z-index:4}

/* supply shop */
.shk{position:relative;display:flex;align-items:flex-end;gap:0;height:230px;margin:0 -14px;overflow:hidden;background:linear-gradient(180deg,#1b2333,#10141c);border-bottom:2px solid var(--rose)}
.shk-bg{position:absolute;inset:0;opacity:.45}
.shk-art{position:relative;z-index:1;width:46%;height:100%;flex:none}
.shk-art .art{width:100%;height:100%}.shk-art img.art{object-fit:cover;object-position:50% 0;transform:scale(1.35);transform-origin:50% 0}
.shk-art .sil{width:100%;height:100%;display:grid;place-items:end center;color:rgba(255,255,255,.25)}
.shk-art .sil svg{width:70%;height:90%}
.shk-talk{position:relative;z-index:1;flex:1;align-self:center;margin-right:12px}
.shk-talk b{display:inline-block;padding:2px 10px;background:var(--rose);color:var(--rose-ink);font-family:var(--hd);font-size:.85rem;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.shk-talk p{margin:6px 0 0;padding:10px 12px;background:rgba(10,12,16,.85);color:#fff;border:1px solid rgba(255,255,255,.14);font-size:.9rem;min-height:3.2em}
.shk-talk p.pop{animation:pop .22s}
.shk-edit{position:absolute;right:8px;top:8px;z-index:2}
.wallet{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.wallet span{display:flex;align-items:center;gap:5px;padding:4px 10px;background:var(--panel);border:1px solid var(--line);font-size:.8rem}
.wallet svg{width:16px;height:16px}
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.si{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px 10px;background:var(--panel);border:1px solid var(--line);text-align:center;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.si .ri{width:52px;height:52px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);transform:rotate(45deg) scale(.85);margin:4px 0}
.si .ri svg{width:28px;height:28px;transform:rotate(-45deg)}
.si b{font-size:.9rem;line-height:1.25}
.si small{color:var(--sub);font-size:.72rem}
.si .btn{width:100%;margin-top:4px;padding:7px 4px;font-size:.85rem}
.si .tag{position:absolute;left:0;top:0;padding:1px 8px;background:#ff4d6d;color:#fff;font-family:var(--en);font-weight:700;font-size:.66rem;letter-spacing:.12em}
.si.soldout{opacity:.45}
.swap{display:flex;align-items:center;gap:10px;padding:10px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);margin:6px 0}
.swap .t{flex:1;font-size:.88rem}
/* cash shop */
.cashhero{position:relative;margin:0 -14px;padding:22px 16px 18px;overflow:hidden;color:#fff;background:radial-gradient(ellipse at 80% 0%,#ff4fa3 0,transparent 55%),radial-gradient(ellipse at 0% 100%,#5b3bff 0,transparent 60%),linear-gradient(135deg,#1a0b3a,#3a0f4f 55%,#5a1a2a)}
.cashhero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(rgba(255,220,120,.9) 1px,transparent 1.5px);background-size:46px 46px,73px 73px;background-position:0 0,20px 30px;opacity:.35;animation:twinkle 4s linear infinite}
@keyframes twinkle{to{background-position:46px 46px,93px -43px}}
.cashhero i{position:relative;display:block;font-style:normal;font-family:var(--en);font-weight:700;letter-spacing:.4em;font-size:.7rem;color:#ffd35a}
.cashhero h2{position:relative;margin:4px 0 0;font-family:var(--hd);font-size:2rem;line-height:1.1;background:linear-gradient(180deg,#fff,#ffd9f0 60%,#ffb400);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 10px rgba(255,80,170,.5))}
.cashhero .bal{position:relative;display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 14px;background:rgba(0,0,0,.35);border:1px solid rgba(255,211,90,.5);font-family:var(--en);font-weight:700;font-size:1.1rem}
.cashhero .bal svg{width:20px;height:20px;color:#7fd8ff}
.cashhero p{position:relative;margin:8px 0 0;font-size:.78rem;opacity:.8}
.cash-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cs-card.gem{flex-direction:column;align-items:stretch;gap:6px;padding:12px 10px;border:1px solid rgba(255,211,90,.35);border-left:1px solid rgba(255,211,90,.35);background:linear-gradient(160deg,#20123d,#141826);color:#fff;text-align:center;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.cs-card.gem .gv{height:70px;display:grid;place-items:center}
.cs-card.gem .gv svg{height:100%;filter:drop-shadow(0 0 10px rgba(120,210,255,.7))}
.cs-card.gem .amt{font-family:var(--en);font-weight:800;font-size:1.5rem;line-height:1}
.cs-card.gem .amt small{display:block;font-size:.7rem;font-weight:600;color:#ffd35a;letter-spacing:.06em;margin-top:2px}
.cs-card.gem .rib{position:absolute;right:-30px;top:10px;transform:rotate(35deg);padding:2px 34px;background:#ff3d7f;font-size:.62rem;font-weight:700;letter-spacing:.06em}
.cs-card.gem .btn{background:linear-gradient(90deg,#ffb400,#ff6aa8);color:#1a0a10;font-weight:800}

.ripple i:nth-child(2){animation-delay:.1s;border-color:var(--rose)}

@keyframes rip{to{transform:scale(1.25);opacity:0}}
.hrt{position:fixed;z-index:76;pointer-events:none;color:#ff6a9a;font-size:20px;text-shadow:0 0 8px rgba(255,100,150,.8);animation:hrt 1.1s ease-out forwards}
@keyframes hrt{0%{transform:translate(0,0) scale(.4);opacity:0}20%{opacity:1;transform:translate(calc(var(--dx)*.3),-18px) scale(1.1)}100%{transform:translate(var(--dx),-80px) scale(.8);opacity:0}}
.r-hop{animation:hop .8s cubic-bezier(.3,1.5,.5,1)!important}
@keyframes hop{25%{transform:translateY(-16px) scale(1.015)}50%{transform:translateY(0) scale(.995,1.005)}70%{transform:translateY(-5px)}100%{transform:none}}
.r-nod{animation:nod .65s ease!important}
@keyframes nod{30%{transform:translateY(6px) rotate(-.8deg)}65%{transform:translateY(-3px) rotate(.6deg)}100%{transform:none}}
.r-flinch{animation:flinch .5s ease!important}
@keyframes flinch{20%{transform:translateX(-8px) rotate(-1.2deg)}50%{transform:translateX(6px) rotate(.6deg)}80%{transform:translateX(-2px)}100%{transform:none}}
.r-shy{animation:shy .9s ease!important}
@keyframes shy{20%{transform:translateX(-5px) rotate(-1.5deg) scale(.99)}45%{transform:translateX(4px) rotate(1deg)}70%{transform:translateX(-2px) rotate(-.4deg)}100%{transform:none}}

/* lobby layout v2 */
.lb-left,.lb-right{top:82px;gap:4px}

/* character screen: compact panel */
.cs-panel{gap:6px;overflow:visible}

const TOKC={};
async function vertexToken(p){

  const enc=o=>b64url(new TextEncoder().encode(JSON.stringify(o)));

  const r=await http(aud,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:{grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:unsigned+'.'+b64url(sig)},form:true,timeout:30000});

  return j.access_token;
}

const RAID_TICKS=700, RG_FLOORS=12;
const RAID_MS=[[0.05,{gems:100,gold:5000}],[0.15,{gems:150,wmat:10,gift:2}],[0.3,{gems:200,core:3}],[0.5,{gems:300,exp:40}],[0.75,{gems:400,core:5}],[1,{gems:800,core:10,wmat:20}]];
function weekKey(){ const d=new Date(Date.now()+9*3600e3), day=(d.getUTCDay()+6)%7; return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()-day)).toISOString().slice(0,10); }
function progK(){ const main=G.chapters.filter(c=>c.kind==='main'); let k=0; main.forEach((ch,i)=>{ if(ch.stages.some(s=>P().cleared[s.id])) k=i; }); return k; }
function hashN(s){ let h=0; for(const ch of String(s)) h=(h*31+ch.charCodeAt(0))|0; return Math.abs(h); }
function RAID(){ const p=P(), wk=weekKey(); let r=p.raid; if(!r||r.wk!==wk){ const lv=r?(r.lv||1)+(r.killed?1:0):1; r=p.raid={wk,lv,dmg:0,killed:false,got:[],tries:{},best:0}; mark('prog'); } return r; }
function raidBoss(){ const r=RAID(), pool=[]; G.chapters.filter(c=>c.kind==='main').forEach(ch=>ch.stages.forEach(s=>(s.enemies||[]).forEach(e=>{ if(e.boss&&!pool.some(x=>x.name===e.name)) pool.push(e); })));
  const src=pool.length?pool[hashN(r.wk)%pool.length]:{name:'거대 잔광',elem:ELEMS[0]}; const b={name:src.name,elem:ELEMS[hashN(r.wk+'e')%3],hp:3000,atk:110,def:50,spd:95,boss:true};
  fitEnemy(b,enemyTarget(progK()+(r.lv-1)*0.6,6,true)*1.3); return Object.assign(b,{total:b.hp*30}); }
function raidTriesLeft(){ const r=RAID(); return Math.max(0,3-(r.tries[today()]||0)); }

async function phPlay(t,c,s,token){
  const lines=parseScript(t.script);
  const alive=()=>PH&&PH.token===token&&$('#phChat');
  while(s.pos<lines.length){
    if(!alive()) return;
    const L=lines[s.pos];
    if(L.cond&&L.cond!==s.pick){s.pos++;continue;}
    if(L.type==='choice'){ $('#phIn').innerHTML=L.opts.map((o,i)=>`<button type="button" class="btn ghost block" data-act="phpick" data-tid="${esc(t.id)}" data-n="${i+1}">${esc(sub(o))}</button>`).join('')+`<button class="linkb ph-sw2" data-act="phmode" data-v="free">⌨ 직접 입력으로 전환</button>`; phMode('pick'); return; }
    let entry=null;
    if(L.type==='say'){
      if(isMe(L.who)){ await wait(400); entry={w:'me',t:sub(L.text)}; }
      else{
        const ty=document.createElement('div'); ty.className='msg'; ty.innerHTML=`<div class="av sm">${art(c)}</div><div class="bub typing"><i></i><i></i><i></i></div>`;
        $('#phChat').appendChild(ty); phScroll();
        await wait(Math.min(1800,500+L.text.length*35)); ty.remove(); if(!alive()) return;
        entry={w:'c',t:sub(L.text)};
      }
    } else if(L.type==='cmd'&&['사진','소품','배경'].includes(L.cmd)){ await wait(800); if(!alive()) return; entry={w:'p',t:L.arg}; }
    else if(L.type==='nar'||L.type==='place'){ entry={w:'s',t:sub(L.text)}; }
    if(!alive()) return;
    s.pos++;
    if(entry){ entry.at=Date.now(); s.log.push(entry); s.at=entry.at; $('#phChat').insertAdjacentHTML('beforeend',bubbleHTML(entry,c)); phScroll(); mark('prog'); }
  }
  if(!s.done){
    s.done=true; s.at=Date.now();
    mark('prog'); if(own(c.id)) addAff(c,10); updateBadge(); checkTriggers();
    if(alive()){ $('#phIn').innerHTML=''; const nx=roomThreads(c.id).find(x=>!x.s.done&&x.t); if(nx){ PH.tid=nx.t.id; nx.s.t0=nx.s.t0||Date.now(); phMode('free'); phPlay(nx.t,c,nx.s,token); } else { PH.tid=null; phMode('free'); } }
  }
}

    profile:$('#f_prof').value.trim(),intro:$('#f_intro').value.trim(),lines:lines($('#f_lines').value),affLines:aff,files,

    touch:{head:lines($('#f_head').value),body:lines($('#f_body').value)},naiPrompt:$('#f_nai').value.trim()});
  c.weapon=Object.assign(c.weapon||{id:'w_'+c.id,img:null},{name:$('#f_wn').value.trim(),desc:$('#f_wd').value.trim(),prompt:$('#f_wp').value.trim()});
  if(!c.weapon.id||c.weapon.id==='w_') c.weapon.id='w_'+c.id;

  e.hp=Math.max(100,Math.round(e.hp*f)); e.atk=Math.max(10,Math.round(e.atk*f)); e.def=Math.max(0,Math.round(e.def*f)); return e; }

function autoSquad(stage){
  const busy=busyIds(), en=stage.enemies, pool=G.chars.filter(c=>own(c.id)&&!busy.has(c.id));
  const score=c=>{const m=matchup(c,en);return charPower(c)*(1+0.25*m.good-0.2*m.bad);};
  pool.sort((a,b)=>score(b)-score(a));
  const pick=[]; const need=['def','sup'];
  need.forEach(r=>{const c=pool.find(x=>x.role===r&&!pick.includes(x.id)); if(c&&score(c)>=score(pool[Math.min(pool.length-1,5)])*0.7) pick.push(c.id);});
  pool.forEach(c=>{if(pick.length<4&&!pick.includes(c.id))pick.push(c.id);});
  const order={def:0,atk:1,sup:2}; return pick.slice(0,4).sort((a,b)=>order[charById(a).role]-order[charById(b).role]);
}

function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function weekKey(d){d=d||new Date();const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const w=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-w);const y=t.getUTCFullYear();return y+'-W'+Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);}

function rotatePickups(){
  const pus=G.banners.filter(b=>b.type==='pickup'&&b.active!==false), L=P().live, ssr=G.chars.filter(c=>c.rarity===3&&!c.limited);
  if(!pus.length||ssr.length<2) return '';
  const names=[], bgs=G.lib.filter(l=>l.kind==='bg');
  pus.forEach(b=>{ let cand=ssr.filter(c=>!L.recentPU.includes(c.id)&&!b.pickup.includes(c.id)); if(!cand.length) cand=ssr.filter(c=>!b.pickup.includes(c.id)); if(!cand.length) return;
    const c=rand(cand); b.pickup=[c.id]; b.name=`${c.name} 확률 업`; b.desc=`SSR ${c.name} 확률 상승`; if(bgs.length) b.bg=rand(bgs).name;
    L.recentPU.unshift(c.id); L.recentPU=L.recentPU.slice(0,Math.max(1,ssr.length-1)); names.push(c.name); });
  return names.length?`확률 업 교체: ${names.join(', ')}`:'';
}

function devId(){ let v=''; try{ v=localStorage.getItem('ggm-devid')||''; if(!v){ v='d'+uid()+uid(); localStorage.setItem('ggm-devid',v); } }catch(e){ v=v||'d0'; } return v; }
function LKMODE(){ const pc=PCS(); if(pc&&pc.lock!==false) return 'pc'; const o=SY(); if(syReady()&&o.lock!==false) return 'gh'; return null; }
const LK={locked:false,t:null,busy:false,claimed:false};
function lkAway(l){ if(!l||!l.id||l.away) return true; const now=l.now||Date.now(); return LKMODE()==='pc'?now-(l.seen||0)>45000:now-(l.at||0)>6*3600e3; }
async function lkGet(){ const m=LKMODE();
  if(m==='pc') return await pcApi('/api/lease');
  if(m==='gh'){ const o=SY(); const r=await gh(o,'/contents/sync/lease.json?ref='+encodeURIComponent(o.branch||'main')+'&t='+Date.now(),{okStatus:[404]}); if(!r||!r.content) return {id:'',away:true,_sha:null,now:Date.now()};
    let j={}; try{ j=JSON.parse(new TextDecoder().decode(b64ToBytes(String(r.content).replace(/\s/g,'')))); }catch(e){} j._sha=r.sha; j.now=Date.now(); return j; }
  return null; }
async function lkOp(op){ const m=LKMODE(), me=devId(), nm=syDevice();
  if(m==='pc') return await pcApi('/api/lease',{method:'POST',body:{op,id:me,name:nm}});
  if(m!=='gh') return null; if(op==='beat') return lkGet(); const o=SY();
  for(let i=0;i<3;i++){ const cur=await lkGet(), now=Date.now(); let nx={id:cur.id||'',name:cur.name||'',at:cur.at||0,away:!!cur.away,want:cur.want||null};
    if(op==='claim') nx={id:me,name:nm,at:now,away:false,want:null};
    else if(op==='want') nx.want={id:me,name:nm,at:now};
    else if(op==='give'){ if(cur.id!==me||!cur.want) return cur; nx={id:cur.want.id,name:cur.want.name,at:now,away:false,want:null}; }
    else if(op==='away'){ if(cur.id!==me) return cur; nx.away=true; }
    else if(op==='free'){ if(cur.id!==me) return cur; nx={id:'',name:'',at:now,away:true,want:null}; }
    const body={message:'play '+op+' · '+nm,content:bytesToB64(new TextEncoder().encode(JSON.stringify(nx)))}; if(cur._sha) body.sha=cur._sha; if(o.branch) body.branch=o.branch;
    const r=await gh(o,'/contents/sync/lease.json',{method:'PUT',body,okStatus:[409,422]}); if(r&&r.content) return Object.assign(nx,{now}); await wait(800); }
  return null; }
async function lkSave(onlyChanged){ const m=LKMODE(); if(m==='pc'){ const pc=PCS(); if(!onlyChanged||(G.prog.savedAt||0)>(pc.localAt||0)+1000) await pcPush(true); }
  else if(m==='gh'){ const o=SY(); if(!onlyChanged||(G.prog.savedAt||0)>(o.localAt||0)+1000) await syPush(true); } }
async function lkNewer(){ const m=LKMODE(); try{
  if(m==='pc'){ const pc=PCS(), S=await pcApi('/api/store/state',{ok404:true}); return !!(S&&S.at>(pc.last||0)&&(S.devId?S.devId!==devId():S.device!==syDevice())); }
  if(m==='gh'){ const o=SY(), R=await syRemote(o), S=R.state; return !!(S&&S.at>(o.last||0)&&(S.devId?S.devId!==devId():S.device!==syDevice())); } }catch(e){} return false; }
async function lkPullIfNewer(){ if(!(await lkNewer())) return false; toast('다른 기기에서 하던 게임을 받아 올게요'); const m=LKMODE(); if(m==='pc') await pcPull(); else if(m==='gh') await syPull(); return true; }
function lkLoop(){ clearInterval(LK.t); const m=LKMODE(); if(!m) return; LK.t=setInterval(lkTick,m==='pc'?12000:45000); }
async function lkTick(){ if(!LKMODE()){ clearInterval(LK.t); return; } if(document.visibilityState!=='visible'||LK.locked||LK.busy) return;
  LK.busy=true; try{ const l=await lkOp('beat'); if(!l) return; const me=devId();
    if(l.id&&l.id!==me){ lkLock(l,'taken'); return; }
    if(l.want&&l.want.id!==me&&((l.now||Date.now())-(l.want.at||0))<180000){ lkLock({name:l.want.name},'giving'); await lkSave(false); await lkOp('give'); lkLock({name:l.want.name},'gave'); }
  }catch(e){} finally{ LK.busy=false; } }
async function lkActivate(){ if(window.__BOOTSYNC){ setTimeout(lkActivate,1500); return; } if(!LKMODE()||LK.busy) return; LK.busy=true; let pulled=false; try{
    const l=await lkGet(), me=devId();
    if(!l||!l.id||l.id===me||lkAway(l)){ const other=l&&l.id&&l.id!==me; await lkOp('claim'); LK.claimed=true; lkUnlock(); lkLoop(); if(other||LK.wasLocked){ LK.wasLocked=false; pulled=await lkPullIfNewer(); } }
    else lkLock(l,'other');
  }catch(e){ /* 연결이 안 되면 막지 않아요 */ } finally{ if(!pulled) LK.busy=false; } }
function lkLock(l,why){ LK.locked=true; LK.wasLocked=true; clearInterval(LK.t); try{ if(B&&!B.over) clearInterval(B.timer); }catch(e){} try{ stopVoice(); }catch(e){}
  const nm=esc((l&&l.name)||'다른 기기');
  const msg={other:[`${nm}에서 하는 중이에요`,'다른 기기에서 플레이하고 있어서 여기는 멈춰 뒀어요. 진행이 섞이지 않게 한 번에 한 기기만 움직여요.'],
    taken:[`${nm}에서 이어서 하고 있어요`,'그쪽으로 넘어갔어요. 여기서 다시 하려면 아래 버튼을 눌러요.'],
    giving:[`${nm}(으)로 넘겨주는 중…`,'지금까지의 진행을 저장하고 있어요. 잠깐만 기다려 주세요.'],
    gave:[`${nm}(으)로 넘겨줬어요`,'진행을 저장하고 넘겨줬어요. 여기서 다시 하려면 아래 버튼을 눌러요.']}[why]||['멈춤',''];
  let d=$('#devlock'); if(!d){ d=document.createElement('div'); d.id='devlock'; document.body.appendChild(d); }
  d.innerHTML=`<div class="dl-box"><div class="dl-ico">⏸</div><b>${msg[0]}</b><p>${msg[1]}</p>${why==='giving'?'<div class="dl-spin"></div>':`<button class="btn" data-act="lktake">여기서 이어하기</button><small>누르면 ${nm}의 진행을 저장받아 이어서 해요.</small>`}</div>`; }
function lkUnlock(){ LK.locked=false; const d=$('#devlock'); if(d) d.remove(); try{ if(B&&!B.over&&B.timer) bRun(); }catch(e){} }
async function lkTake(btn){ if(LK.busy) return; LK.busy=true; const box=$('#devlock .dl-box'); const pcm=LKMODE()==='pc', me=devId(); let ok=false, pulled=false;
  const say=(t,s)=>{ if(box) box.innerHTML=`<div class="dl-ico">↻</div><b>${t}</b><p>${s||''}</p><div class="dl-spin"></div>`; };
  try{ let l=await lkGet();
    if(l&&l.id&&l.id!==me&&!lkAway(l)){ await lkOp('want'); const until=Date.now()+(pcm?25000:75000);
      while(Date.now()<until){ say('넘겨받는 중…',`${esc(l.name||'다른 기기')}에서 저장을 마치면 바로 이어져요. (${Math.ceil((until-Date.now())/1000)}초)`); await wait(pcm?2000:6000); const x=await lkGet(); if(x.id===me){ ok=true; break; } if(lkAway(x)) break; } }
    if(!ok) await lkOp('claim');
    LK.claimed=true; LK.wasLocked=false; say('최신 진행을 확인하는 중…'); pulled=await lkPullIfNewer(); if(!pulled){ lkUnlock(); lkLoop(); toast('여기서 이어서 해요'); }
  }catch(e){ if(box) box.insertAdjacentHTML('beforeend','<p style="color:var(--rose)">연결에 실패했어요. 잠시 뒤 다시 눌러 주세요.</p><button class="btn" data-act="lktake">다시 시도</button>'); }
  finally{ if(!pulled) LK.busy=false; } }

  ov.querySelector('#bsSkip').onclick=()=>{ skip=true; };
  try{ const TO=Symbol('to'); const S=await Promise.race([mode==='pc'?pcApi('/api/store/state',{ok404:true,timeout:9000}):syRemote(so).then(R=>R.state), new Promise(r=>{ const iv=setInterval(()=>{ if(skip){ clearInterval(iv); r(TO); } },200); setTimeout(()=>{ clearInterval(iv); r(TO); },mode==='pc'?10000:15000); })]);

async function pcApi(path,opt){ const pc=PCS(); if(!pc) throw {code:'network',message:'PC 서버가 연결돼 있지 않아요'}; opt=opt||{};
  const r=await http(pc.base+path,{method:opt.method||'GET',headers:Object.assign({'X-GGM-Key':pc.key},opt.body?{'Content-Type':'application/json'}:{}),body:opt.body,binary:!!opt.binary,timeout:opt.timeout||120000});
  if(r.status===404&&opt.ok404) return null; if(r.status===401) throw {code:'bad_key',message:'PC 서버 키가 맞지 않아요. QR을 다시 찍어 주세요'}; if(r.status>=400) throw errOf(r);
  if(opt.binary) return r; try{ return r.text?JSON.parse(r.text):{}; }catch(e){ return {}; } }

async function pcPush(silent){

    const have=new Set(((await pcApi('/api/store/list'))||{}).blobs||[]), idx=syIdx(), keys=await idbKeys(), bin={}, types={};
    for(const k of keys){ const b=await idbGet(k); if(!b||!(b instanceof Blob)) continue; types[k]=b.type||''; const ent=idx[k]; let h;
      if(ent&&ent.size===b.size&&ent.hash) h=ent.hash; else { h=await shaHex(await b.arrayBuffer()); idx[k]={hash:h,size:b.size}; } bin[k]=h;
      if(!have.has(h)){ await pcApi('/api/store/blob/'+h,{method:'POST',body:{content:bytesToB64(new Uint8Array(await b.arrayBuffer()))}}); have.add(h); } }
    saveSyIdx(idx);

const SYKEY='ggm-sync', SYIDX='ggm-sync-idx';
function SY(){ try{ return JSON.parse(localStorage.getItem(SYKEY))||{}; }catch(e){ return {}; } }
function saveSY(o){ localStorage.setItem(SYKEY,JSON.stringify(o)); }
function syIdx(){ try{ return JSON.parse(localStorage.getItem(SYIDX))||{}; }catch(e){ return {}; } }
function saveSyIdx(o){ try{ localStorage.setItem(SYIDX,JSON.stringify(o)); }catch(e){} }
function syDevice(){ const o=SY(); return o.device||(IS_NATIVE?'안드로이드 폰':IS_IOS?'아이폰':document.body.classList.contains('desk')?'PC':'브라우저'); }
function syReady(){ const o=SY(); return !!(o.repo&&o.token); }
function bytesToB64(u8){ let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }
async function shaHex(buf){ const h=await crypto.subtle.digest('SHA-256',buf); return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function ghH(o,extra){ return Object.assign({Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',Authorization:'Bearer '+String(o.token||'').trim()},extra||{}); }
async function gh(o,path,opt){ opt=opt||{}; const tries=opt.tries||0; let r; try{ r=await http('https://api.github.com/repos/'+o.repo.trim()+path,{method:opt.method||'GET',headers:ghH(o,Object.assign(opt.body?{'Content-Type':'application/json'}:{},opt.binary?{Accept:'application/vnd.github.raw+json'}:{})),body:opt.body,binary:!!opt.binary,timeout:opt.timeout||120000}); }catch(e){ if(tries<4){ await wait(2000*Math.pow(2,tries)); return gh(o,path,Object.assign({},opt,{tries:tries+1})); } throw e; }
  if(r.status>=500&&r.status<600&&tries<4){ await wait(2000*Math.pow(2,tries)); return gh(o,path,Object.assign({},opt,{tries:tries+1})); }
  if(r.status===403||r.status===429){ const t=r.text||''; if(/secondary rate|abuse|rate limit/i.test(t)&&!opt.retried){ await wait(61000); return gh(o,path,Object.assign({},opt,{retried:true})); } }
  if(r.status>=400&&!opt.okStatus?.includes(r.status)) throw Object.assign(errOf(r),{status:r.status});
  if(opt.binary) return r; try{ return r.text?JSON.parse(r.text):{}; }catch(e){ return {}; } }
function syLsKeys(withKeys){ const pj=PJ(); const keys=[PJKEY,SETUP_KEY,...pj.list.map(x=>pjKey(x.id))]; keys.push(NKEY,SKEY); if(withKeys) keys.push(PKEY); return keys; }
function syStrip(k,v,withKeys){ if(withKeys||v==null) return v; try{ if(k===NKEY){ const o=JSON.parse(v); delete o.key; return JSON.stringify(o); } if(k===SKEY){ const o=JSON.parse(v); delete o.fishKey; delete o.elKey; return JSON.stringify(o); } }catch(e){} return v; }
function syMerge(k,v){ if(v==null) return v; try{ if(k===NKEY){ const cur=JSON.parse(localStorage.getItem(NKEY)||'{}'), o=JSON.parse(v); if(!o.key&&cur.key) o.key=cur.key; return JSON.stringify(o); } if(k===SKEY){ const cur=JSON.parse(localStorage.getItem(SKEY)||'{}'), o=JSON.parse(v); ['fishKey','elKey'].forEach(x=>{ if(!o[x]&&cur[x]) o[x]=cur[x]; }); return JSON.stringify(o); } }catch(e){} return v; }
let SYJOB=null;
function syBar(t){ let el=$('#syBar'); if(!t){ if(el) el.remove(); return; } if(!el){ el=document.createElement('div'); el.id='syBar'; el.className='prepchip'; document.body.appendChild(el); } el.innerHTML=`<b>☁ ${esc(t)}</b>`; }
async function syRemote(o){ // -> {head,tree,paths,state}
  let ref=await gh(o,'/git/ref/heads/'+(o.branch||'main'),{okStatus:[404,409]});
  if(!ref||!ref.object){ await gh(o,'/contents/README.md',{method:'PUT',body:{message:'init',content:bytesToB64(new TextEncoder().encode('가챠 게임 메이커 동기화 저장소 (비공개로 두세요)'))}}); ref=await gh(o,'/git/ref/heads/'+(o.branch||'main')); }
  const head=ref.object.sha, commit=await gh(o,'/git/commits/'+head), tree=await gh(o,'/git/trees/'+commit.tree.sha+'?recursive=1');
  const paths={}; (tree.tree||[]).forEach(x=>{ if(x.type==='blob') paths[x.path]=x.sha; });
  let state=null; if(paths['sync/state.json']){ const r=await gh(o,'/git/blobs/'+paths['sync/state.json'],{binary:true}); try{ let j=JSON.parse(r.bytes?new TextDecoder().decode(r.bytes):(r.text||'')); if(j&&j.encoding==='base64'&&j.content) j=JSON.parse(new TextDecoder().decode(b64ToBytes(j.content.replace(/\s/g,'')))); state=j; }catch(e){} }
  return {head,treeSha:commit.tree.sha,paths,state};
}

function parseScript(t){
  return String(t||'').split('\n').map(l=>l.trim()).filter(Boolean).map(raw=>{
    let l=raw,cond=0,m,o;
    if((m=l.match(/^(\d)\)\s*(.+)$/))){cond=+m[1];l=m[2];}
    if(/^\[소품\s*끝\]$/.test(l)) o={type:'cmd',cmd:'소품끝',arg:''};
    else if(/^\[음악\s*끝\]$/.test(l)) o={type:'cmd',cmd:'음악끝',arg:''};
    else if(/^\[톡\s*끝\]$/.test(l)) o={type:'cmd',cmd:'톡끝',arg:''};
    else if(/^\[CG\s*끝\]$/i.test(l)) o={type:'cmd',cmd:'CG끝',arg:''};
    else if((m=l.match(/^\[(배경|소품|효과음|효과|사진|음악|톡|CG|cg)\s*[:：]\s*(.+?)\]$/))) o={type:'cmd',cmd:m[1],arg:m[2].trim()};
    else if((m=l.match(/^\[(.+?)\]/))) o={type:'place',text:m[1].trim()};
    else if((m=l.match(/^선택\s*[:：]\s*(.+)$/))) o={type:'choice',opts:m[1].split('|').map(s=>s.trim()).filter(Boolean)};
    else if((m=l.match(/^([^:：\s][^:：]{0,20})[:：]\s*(.+)$/))){ let who=m[1].trim(),face=''; const fm=who.match(/^(.+?)\s*\[(.+?)\]$/); if(fm){who=fm[1].trim();face=fm[2].trim();} const cm=m[2].trim().match(/^\[(배경|소품|효과음|효과|사진|음악|톡|CG|cg)\s*[:：]\s*(.+?)\]$/); o=cm?{type:'cmd',cmd:cm[1],arg:cm[2].trim(),who}:{type:'say',who,face,text:m[2]}; }
    else o={type:'nar',text:l};
    o.cond=cond; return o;
  });
}

const blobToData=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b);});
